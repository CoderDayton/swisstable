name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # clang provides the wasm32 target; wasm-ld ships in the lld package.
      - name: Install the wasm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # Printed on its own so a missing or mismatched linker is obvious in
      # the log rather than surfacing as a confusing clang failure below.
      - name: Report toolchain versions
        run: |
          clang --version
          wasm-ld --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Split from the JS build so the log attributes a failure to the
      # right half of the toolchain.
      - name: Build wasm modules
        run: bun run build:wasm

      - name: Build JavaScript and type declarations
        run: bun run build:js

      # Covers tests, scripts, and examples, which the publish build in
      # build:js does not include.
      - name: Typecheck
        run: bun run typecheck

      # Loads the modules built above, so build:wasm is a prerequisite.
      - name: Test
        run: bun test
