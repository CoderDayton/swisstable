name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # clang provides the wasm32 target; wasm-ld ships in the lld package.
      - name: Install the wasm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # Printed on its own so a missing or mismatched linker is obvious in
      # the log rather than surfacing as a confusing clang failure below.
      - name: Report toolchain versions
        run: |
          clang --version
          wasm-ld --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Split from the JS build so the log attributes a failure to the
      # right half of the toolchain.
      - name: Build wasm modules
        run: bun run build:wasm

      # src/generated is committed so the package typechecks on a clone with
      # no clang. The build just rewrote it from native/*.c, so anything the
      # working tree reports here means the committed copy is out of date.
      #
      # git status rather than git diff: diff only reports tracked files, so a
      # payload for a newly added module that was never committed would land
      # untracked and pass silently -- the case this gate most needs to catch.
      - name: Verify generated sources are current
        run: |
          changes="$(git status --porcelain --untracked-files=all src/generated)"
          if [ -n "$changes" ]; then
            echo "src/generated is stale or incomplete:" >&2
            echo "$changes" >&2
            echo "run 'bun run build:wasm' and commit the result" >&2
            exit 1
          fi

      - name: Build JavaScript and type declarations
        run: bun run build:js

      # Covers tests, scripts, and examples, which the publish build in
      # build:js does not include.
      - name: Typecheck
        run: bun run typecheck

      # Loads the modules built above, so build:wasm is a prerequisite.
      - name: Test
        run: bun test
