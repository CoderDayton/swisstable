name: Release

# Pushing a version tag is the whole release trigger: it publishes to npm and
# creates the GitHub release. Nothing here runs on a normal push to main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # mint the OIDC token npm provenance signs with

# Never cancel a release mid-flight; a half-published version is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-24.04

    steps:
      # Actions are pinned to a commit, not a tag. This job holds the npm
      # token and the OIDC permission provenance is signed with, so a moved
      # tag here would be a supply-chain compromise of the published package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Only for `npm publish`. The registry-url is what writes the .npmrc
      # that picks up NODE_AUTH_TOKEN below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The version scripts/toolchain.ts pins, verified against its published
      # SHA-256 before it is unpacked. Reproducing a tag's bytes depends on
      # the exact compiler, which is why this is pinned rather than installed
      # from the image; CI builds the committed payload with the same one.
      - name: Install the pinned Zig toolchain
        run: bun run toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody can
      # find by tag. Fail before anything is built.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag, package.json says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - name: Build
        run: bun run build

      # The build just rewrote src/generated from native/*.c, so anything the
      # working tree reports here means the wasm this tag publishes is not
      # the wasm committed at this tag. Same gate as ci.yml, on the path that
      # actually ships: without it a release is self-consistent but has no
      # audit trail back to the source in git.
      - name: Verify generated sources match the tag
        run: |
          changes="$(git status --porcelain --untracked-files=all src/generated)"
          if [ -n "$changes" ]; then
            echo "src/generated does not match a fresh build of native/*.c:" >&2
            echo "$changes" >&2
            echo "the wasm this tag would publish is not the wasm it committed" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The tarball below is packed from dist/js, so this is the last chance
      # to catch a build that Bun runs and Node cannot load.
      - name: Smoke-test the build under Node
        run: node scripts/smoke-node.mjs

      # The browser has no Node compatibility layer behind it, so it is the
      # only place a `node:` import reaching into src/ would surface. Chrome
      # ships on the runner.
      - name: Smoke-test the build in a browser
        run: bun run smoke:browser

      # Produces the tarball attached to the release. It is packed from the
      # same tree publish uses, so the contents match, but npm publishes its
      # own pack rather than this file -- provenance is only documented for
      # publishing a directory, so the tarball is the asset, not the input.
      #
      # --ignore-scripts matters for more than speed: npm pack runs `prepare`,
      # and lefthook writes "sync hooks: ..." to stdout, which would end up
      # captured as part of the filename. The build already ran above, so
      # there is nothing for the lifecycle scripts to contribute here.
      - name: Pack the release asset
        id: pack
        run: |
          tarball="$(npm pack --silent --ignore-scripts)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed $tarball"
          npm pack --dry-run --ignore-scripts

      # --access public is required on a first publish. Provenance needs the
      # id-token permission above, a GitHub-hosted runner, and package.json's
      # repository field to match this repository case-sensitively.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.tarball }}" \
            dist/wasm/swiss_u32.wasm \
            dist/wasm/swiss_u64.wasm
