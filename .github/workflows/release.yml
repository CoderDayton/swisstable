name: Release

# Pushing a version tag is the whole release trigger: it publishes to npm and
# creates the GitHub release. Nothing here runs on a normal push to main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # reserved for npm provenance, see the publish step

# Never cancel a release mid-flight; a half-published version is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # clang provides the wasm32 target; wasm-ld ships in the lld package.
      - name: Install the wasm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Only for `npm publish`. The registry-url is what writes the .npmrc
      # that picks up NODE_AUTH_TOKEN below.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody can
      # find by tag. Fail before anything is built.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag, package.json says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Pack once and publish that exact file, so the tarball attached to the
      # release is byte-for-byte the one on npm rather than a second build.
      #
      # --ignore-scripts matters for more than speed: npm pack runs `prepare`,
      # and lefthook writes "sync hooks: ..." to stdout, which would end up
      # captured as part of the filename. The build already ran above, so
      # there is nothing for the lifecycle scripts to contribute here.
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --silent --ignore-scripts)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed $tarball"
          npm pack --dry-run --ignore-scripts

      # Add --provenance once the repository and package are public; npm
      # rejects provenance for private repositories.
      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.tarball }}" \
            dist/wasm/swiss_u32.wasm \
            dist/wasm/swiss_u64.wasm
